<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل الحضور والغياب | المدرسة الفنلندية العمانية</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print-arabic-global.css">

<style>
:root{
  --navy:#0D2137;--blue:#1565C0;--sky:#2196F3;--teal:#00897B;
  --gold:#F9A825;--red:#C62828;--green:#2E7D32;--purple:#6A1B9A;
  --bg:#F0F4F8;--card:#FFFFFF;--border:#CBD5E1;
  --text:#1E293B;--muted:#64748B;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Cairo',sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  padding:20px;
}

.container{
  max-width:1400px;
  margin:0 auto;
}

.header{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  color:var(--navy);
  font-size:24px;
}

.header-actions{
  display:flex;
  gap:10px;
}

.btn{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s;
}

.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--sky));
  color:#fff;
}

.btn-secondary{
  background:#fff;
  border:2px solid var(--border);
  color:var(--navy);
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.stat-card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  text-align:center;
}

.stat-value{
  font-size:32px;
  font-weight:900;
  margin-bottom:5px;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
}

.attendance-table{
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 12px rgba(0,0,0,0.08);
  overflow:hidden;
}

.table-header{
  background:var(--navy);
  color:#fff;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.search-box{
  display:flex;
  gap:10px;
  align-items:center;
}

.search-box input{
  padding:8px 15px;
  border:none;
  border-radius:6px;
  font-family:inherit;
  font-size:14px;
  min-width:300px;
}

.filter-select{
  padding:8px 15px;
  border:none;
  border-radius:6px;
  font-family:inherit;
  font-size:14px;
  background:#fff;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead th{
  background:var(--blue);
  color:#fff;
  padding:15px;
  text-align:center;
  font-weight:600;
  font-size:13px;
}

tbody td{
  padding:15px;
  border-bottom:1px solid var(--border);
  text-align:center;
}

tbody tr:hover{
  background:#f8fafc;
}

.student-name{
  text-align:right;
  font-weight:600;
  color:var(--navy);
}

.attendance-badge{
  display:inline-block;
  padding:4px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
}

.badge-present{
  background:#e8f5e9;
  color:#2e7d32;
}

.badge-absent{
  background:#ffebee;
  color:#c62828;
}

.badge-late{
  background:#fff9c4;
  color:#f9a825;
}

.badge-excused{
  background:#e3f2fd;
  color:#1565c0;
}

.mark-btn{
  padding:6px 12px;
  border:none;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  transition:all 0.2s;
}

.mark-present{background:#e8f5e9;color:#2e7d32;}
.mark-absent{background:#ffebee;color:#c62828;}
.mark-late{background:#fff9c4;color:#f9a825;}

.mark-btn:hover{
  transform:scale(1.05);
}

.month-selector{
  background:#fff;
  padding:15px 20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.06);
  margin-bottom:20px;
  display:flex;
  gap:15px;
  align-items:center;
}

.month-selector label{
  font-weight:600;
  color:var(--navy);
}

.month-selector select{
  padding:8px 15px;
  border:1px solid var(--border);
  border-radius:6px;
  font-family:inherit;
  font-size:14px;
}

@media print{
  .no-print{display:none !important;}
  body{padding:0;}
  .attendance-table{box-shadow:none;}
}
</style>
</head>
<body>

<div class="container">
  <div class="header no-print">
    <h1>📅 سجل الحضور والغياب</h1>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="exportAttendance()">📊 تصدير التقرير</button>
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">← العودة</button>
    </div>
  </div>

  <div class="stats no-print">
    <div class="stat-card" style="border-top:4px solid #2e7d32">
      <div class="stat-value" style="color:#2e7d32" id="stat-present">0</div>
      <div class="stat-label">حاضر اليوم</div>
    </div>
    <div class="stat-card" style="border-top:4px solid #c62828">
      <div class="stat-value" style="color:#c62828" id="stat-absent">0</div>
      <div class="stat-label">غائب اليوم</div>
    </div>
    <div class="stat-card" style="border-top:4px solid #f9a825">
      <div class="stat-value" style="color:#f9a825" id="stat-late">0</div>
      <div class="stat-label">متأخر اليوم</div>
    </div>
    <div class="stat-card" style="border-top:4px solid #1565c0">
      <div class="stat-value" style="color:#1565c0" id="stat-total">0</div>
      <div class="stat-label">إجمالي الطلاب</div>
    </div>
  </div>

  <div class="month-selector no-print">
    <label>الشهر:</label>
    <select id="month-select" onchange="filterByMonth()">
      <option value="current">الشهر الحالي</option>
      <option value="09">سبتمبر 2025</option>
      <option value="10">أكتوبر 2025</option>
      <option value="11">نوفمبر 2025</option>
      <option value="12">ديسمبر 2025</option>
      <option value="01">يناير 2026</option>
      <option value="02">فبراير 2026</option>
      <option value="03">مارس 2026</option>
      <option value="04">أبريل 2026</option>
      <option value="05">مايو 2026</option>
      <option value="06">يونيو 2026</option>
    </select>
    
    <label style="margin-right:20px">التاريخ:</label>
    <input type="date" id="date-select" onchange="loadAttendance()" style="padding:8px 15px;border:1px solid var(--border);border-radius:6px;font-family:inherit;">
  </div>

  <div class="attendance-table">
    <div class="table-header no-print">
      <h3>سجل اليوم: <span id="current-date"></span></h3>
      <div class="search-box">
        <input type="text" id="search" placeholder="🔍 بحث عن طالب..." onkeyup="searchStudents()">
        <select class="filter-select" id="grade-filter" onchange="filterStudents()">
          <option value="all">جميع الصفوف</option>
          <option value="EY1">EY1</option>
          <option value="EY2">EY2</option>
          <option value="الصف الأول">الصف الأول</option>
          <option value="الصف الثاني">الصف الثاني</option>
          <option value="الصف الثالث">الصف الثالث</option>
          <option value="الصف الرابع">الصف الرابع</option>
          <option value="الصف الخامس">الصف الخامس</option>
        </select>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:40px">#</th>
          <th style="text-align:right">اسم الطالب</th>
          <th style="width:100px">الصف</th>
          <th style="width:120px">الحالة</th>
          <th class="no-print" style="width:200px">تسجيل الحضور</th>
          <th style="width:120px">عدد أيام الغياب هذا الشهر</th>
          <th class="no-print" style="width:100px">ملاحظات</th>
        </tr>
      </thead>
      <tbody id="attendance-tbody">
        <!-- Will be populated by JavaScript -->
      </tbody>
    </table>
  </div>
</div>

<script>
const DB_KEY = 'iep_platform_db';
const SES_KEY = 'iep_current_session';
let currentUser = null;
let attendanceData = {};
let studentsData = [];

// Load on page load
window.onload = function(){
  // Get current user - FIXED: Use correct session key
  const session = localStorage.getItem(SES_KEY);
  if(session){
    try {
      const sessionData = JSON.parse(session);
      // Load user from database using userId
      const db = loadDB();
      if(db && db.users && sessionData.userId){
        currentUser = db.users.find(u => u.id === sessionData.userId);
      }
    } catch(e) {
      console.error('Session parse error:', e);
    }
  }
  
  if(!currentUser){
    // Show styled message instead of ugly alert
    document.body.innerHTML = `
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        min-height:100vh;
        background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: 'Cairo', sans-serif;
        direction: rtl;
      ">
        <div style="
          background:#fff;
          padding:40px;
          border-radius:20px;
          box-shadow:0 20px 60px rgba(0,0,0,0.3);
          text-align:center;
          max-width:400px;
        ">
          <div style="font-size:64px;margin-bottom:20px;">🔐</div>
          <h2 style="color:#0D2137;margin-bottom:15px;font-size:24px;">يلزم تسجيل الدخول</h2>
          <p style="color:#64748b;margin-bottom:30px;line-height:1.8;">
            للوصول إلى سجل الحضور والغياب، يرجى تسجيل الدخول أولاً
          </p>
          <button onclick="window.location.href='index.html'" style="
            background:linear-gradient(135deg, #1565C0, #2196F3);
            color:#fff;
            border:none;
            padding:15px 40px;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            font-family:inherit;
            box-shadow:0 4px 15px rgba(21,101,192,0.4);
          ">
            🔙 الذهاب لتسجيل الدخول
          </button>
        </div>
      </div>
    `;
    return;
  }
  
  // Set today's date
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('date-select').value = today;
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('ar-SA');
  
  // Load data
  loadStudents();
  loadAttendance();
};

function loadDB(){
  const saved = localStorage.getItem(DB_KEY);
  return saved ? JSON.parse(saved) : {students: [], users: []};
}

function loadStudents(){
  const saved = localStorage.getItem(DB_KEY);
  if(!saved) return;
  
  const db = JSON.parse(saved);
  const isAdmin = currentUser.role === 'admin';
  
  // Filter students by teacher
  studentsData = isAdmin 
    ? db.students 
    : db.students.filter(s => s.teacherId === currentUser.id);
  
  renderAttendance();
}

function loadAttendance(){
  const dateKey = document.getElementById('date-select').value;
  const saved = localStorage.getItem('attendance_' + dateKey);
  
  attendanceData = saved ? JSON.parse(saved) : {};
  renderAttendance();
}

function renderAttendance(){
  const tbody = document.getElementById('attendance-tbody');
  const gradeFilter = document.getElementById('grade-filter').value;
  const searchTerm = document.getElementById('search').value.toLowerCase();
  
  let filteredStudents = studentsData;
  
  // Filter by grade
  if(gradeFilter !== 'all'){
    filteredStudents = filteredStudents.filter(s => s.grade === gradeFilter);
  }
  
  // Filter by search
  if(searchTerm){
    filteredStudents = filteredStudents.filter(s => 
      s.name.toLowerCase().includes(searchTerm)
    );
  }
  
  tbody.innerHTML = '';
  
  let presentCount = 0;
  let absentCount = 0;
  let lateCount = 0;
  
  filteredStudents.forEach((student, index) => {
    const status = attendanceData[student.id] || 'غائب';
    const monthlyAbsent = getMonthlyAbsence(student.id);
    
    if(status === 'حاضر') presentCount++;
    else if(status === 'غائب') absentCount++;
    else if(status === 'متأخر') lateCount++;
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td class="student-name">${student.name}</td>
      <td>${student.grade}</td>
      <td>
        <span class="attendance-badge badge-${status === 'حاضر' ? 'present' : status === 'غائب' ? 'absent' : status === 'متأخر' ? 'late' : 'excused'}">
          ${status}
        </span>
      </td>
      <td class="no-print">
        <button class="mark-btn mark-present" onclick="markAttendance('${student.id}','حاضر')">✓ حاضر</button>
        <button class="mark-btn mark-absent" onclick="markAttendance('${student.id}','غائب')">✗ غائب</button>
        <button class="mark-btn mark-late" onclick="markAttendance('${student.id}','متأخر')">⏰ متأخر</button>
      </td>
      <td><strong style="color:${monthlyAbsent > 3 ? '#c62828' : '#666'}">${monthlyAbsent}</strong></td>
      <td class="no-print">
        <button class="mark-btn" style="background:#e3f2fd;color:#1565c0" onclick="addNote('${student.id}')">📝</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  
  // Update stats
  document.getElementById('stat-present').textContent = presentCount;
  document.getElementById('stat-absent').textContent = absentCount;
  document.getElementById('stat-late').textContent = lateCount;
  document.getElementById('stat-total').textContent = filteredStudents.length;
}

function markAttendance(studentId, status){
  const dateKey = document.getElementById('date-select').value;
  
  attendanceData[studentId] = status;
  
  // Save to localStorage
  localStorage.setItem('attendance_' + dateKey, JSON.stringify(attendanceData));
  
  renderAttendance();
}

function getMonthlyAbsence(studentId){
  const currentDate = new Date(document.getElementById('date-select').value);
  const month = currentDate.getMonth();
  const year = currentDate.getFullYear();
  
  let count = 0;
  
  // Check all days in this month
  for(let day = 1; day <= 31; day++){
    const dateKey = `${year}-${String(month + 1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const saved = localStorage.getItem('attendance_' + dateKey);
    if(saved){
      const data = JSON.parse(saved);
      if(data[studentId] === 'غائب'){
        count++;
      }
    }
  }
  
  return count;
}

function searchStudents(){
  renderAttendance();
}

function filterStudents(){
  renderAttendance();
}

function filterByMonth(){
  renderAttendance();
}

function addNote(studentId){
  const note = prompt('أضف ملاحظة للطالب:');
  if(note){
    alert('تم حفظ الملاحظة: ' + note);
    // TODO: Save notes to database
  }
}

function exportAttendance(){
  window.print();
}
</script>

</body>
</html>
