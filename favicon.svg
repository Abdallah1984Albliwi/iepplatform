<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB8C00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg)"/>
  
  <!-- Book icon -->
  <g transform="translate(34, 34)">
    <!-- Book pages -->
    <rect x="12" y="8" width="36" height="44" rx="2" fill="#FFFFFF" opacity="0.9"/>
    <rect x="8" y="10" width="36" height="44" rx="2" fill="#FFFFFF"/>
    
    <!-- Book spine -->
    <rect x="4" y="12" width="4" height="44" fill="url(#accent)"/>
    
    <!-- Lines on page -->
    <line x1="14" y1="20" x2="38" y2="20" stroke="#1565C0" stroke-width="1.5" opacity="0.3"/>
    <line x1="14" y1="26" x2="38" y2="26" stroke="#1565C0" stroke-width="1.5" opacity="0.3"/>
    <line x1="14" y1="32" x2="32" y2="32" stroke="#1565C0" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Graduation cap on book -->
    <g transform="translate(16, -4)">
      <polygon points="10,10 20,6 30,10 20,14" fill="url(#accent)"/>
      <rect x="19" y="10" width="2" height="8" fill="url(#accent)"/>
      <circle cx="20" cy="18" r="2" fill="url(#accent)"/>
    </g>
  </g>
  
  <!-- Shadow effect -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="#0D47A1" stroke-width="2" opacity="0.3"/>
</svg>
